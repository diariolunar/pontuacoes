<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jornada Mística | Central Lunar</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div id="header"></div>
  <main class="dashboard-layout">
    <div id="sidebar"></div>
    <section class="dashboard-content">
      <div class="page-title">
        <span class="tag">Painel Administrativo</span>
        <h1>Jornada Mística</h1>
        <p>Confira os registros da Jornada Mística da semana atual.</p>
      </div>
      <div class="page-actions">
        <a href="./enviar-jornada-mistica.html" class="btn secondary">Enviar nova lista</a>
        <button type="button" id="limparSemanaBtn" class="btn danger">Limpar lista da semana</button>
      </div>
      <div class="summary-line">
        <span id="semanaAtualTexto">Semana atual: carregando...</span>
        <span id="totalMembrosTexto">Registros encontrados: 0</span>
      </div>
      <div class="panel">
        <div class="panel-header"><h2>Registros da semana</h2></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col">Nome</th>
                <th scope="col">User</th>
                <th scope="col">Pontos</th>
                <th scope="col">Obras, feedback e resultado</th>
              </tr>
            </thead>
            <tbody id="categoriaTabela"></tbody>
          </table>
        </div>
      </div>
      <p id="categoriaMessage" class="message"></p>
    </section>
  </main>
  <div id="footer"></div>
  <script type="module" src="./js/core/components.js"></script>
  <script type="module" src="./js/pages/jornada-mistica.js"></script>
</body>
</html>
